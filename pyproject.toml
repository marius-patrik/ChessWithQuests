[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chesswithquests"
version = "0.1.0"
description = "A board game engine in which the configuration is the product: chess and checkers share one engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "NONE" }
authors = [{ name = "marius-patrik" }]
keywords = ["chess", "checkers", "board game", "engine", "mvc", "quests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
# The runtime uses the standard library and tkinter, and nothing else. `python-chess` is
# banned: FEN, PGN, SAN and coordinate conversion are hand-rolled in this repository.
dependencies = []

[project.urls]
Homepage = "https://github.com/marius-patrik/ChessWithQuests"
Documentation = "https://marius-patrik.github.io/ChessWithQuests/"
"Architecture diagram" = "https://app.diagrams.net/#G19OY7iySOQWRAZDFKy1r-7tJKG_L-_Qn8#%7B%22pageId%22%3A%22C5RBs43oDa-KdzZeNtuy%22%7D"

[project.gui-scripts]
chesswithquests = "chesswithquests:main"

[tool.setuptools]
# A flat layout plus auto-discovery trips over `tests/` sitting at the root, so the package
# list is explicit. `games` is listed because a configuration is a Python package of its own:
# an install that ships only the engine cannot find its own default configuration.
packages = [
    "chesswithquests",
    "controller",
    "games",
    "games.chess",
    "games.chess.clocks",
    "games.chess.export",
    "games.chess.pieces",
    "games.chess.quests",
    "games.chess.rules",
    "games.checkers",
    "games.checkers.clocks",
    "games.checkers.export",
    "games.checkers.pieces",
    "games.checkers.quests",
    "games.checkers.rules",
    "model",
    "model.game",
    "model.misc",
    "model.pieces",
    "model.users",
    "view",
]
include-package-data = true

[tool.setuptools.package-data]
# `games/` holds one file that is not Python: the declaration naming the configuration a game
# starts in. Everything else in a configuration is a package, so this is the one line that
# keeps a `pip install` from shipping a `games/` directory in which nothing is protected and
# nothing leads — a default only an installed distribution would have lost.
games = ["default.json"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
)/
'''