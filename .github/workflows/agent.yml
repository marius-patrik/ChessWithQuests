name: Autonomous Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

# The runner, the container and the harness registry all come from the pinned pipeline. This file
# is a caller, not a copy, so this repository no longer carries its own agent.
#
# Every credential is passed explicitly: a called workflow sees the caller's secrets only when they
# are given to it. Each is optional upstream, so the ones this repository does not hold simply
# shorten the fallback chain.
permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write
  actions: write

jobs:
  agent:
    uses: marius-patrik/DarkFactory/.github/workflows/agent.yml@6d42a0ea793a3e1fc26876ff99662a94f82bb987
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "6d42a0ea793a3e1fc26876ff99662a94f82bb987"
      agent-enabled: ${{ vars.AGENT_ENABLED }}
    secrets:
      DARKFACTORY_APP_PRIVATE_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
      ANTIGRAVITY_REFRESH_TOKEN: ${{ secrets.ANTIGRAVITY_REFRESH_TOKEN }}
      ANTIGRAVITY_CLIENT_ID: ${{ secrets.ANTIGRAVITY_CLIENT_ID }}
      ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
