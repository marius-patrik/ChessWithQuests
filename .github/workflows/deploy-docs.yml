name: Deploy Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The documentation build, the theme, the hooks and the version manifest all come from the pinned
# pipeline. This file is a caller, not a copy.
#
# No `concurrency` here on purpose: the shared workflow already declares the `pages` group, and a
# caller holding the same group deadlocks the run it is calling.
permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    uses: marius-patrik/DarkFactory/.github/workflows/deploy-docs.yml@f87fecc9f0f64b395f4195f04e668c0bd00060f8
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: f87fecc9f0f64b395f4195f04e668c0bd00060f8
