name: Deploy Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Published by pushing the built site to the `gh-pages` branch rather than through the Pages build
# action, because per-pull-request previews live under `pr-<N>/` on that same branch: GitHub Pages
# has one source, so the site and the previews cannot use two different mechanisms.
permissions:
  contents: write
  deployments: write

# One deploy at a time, and a deploy already running is never cancelled halfway: cancelling it
# would leave the branch rewritten from a build that never finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build documentation
        # Every page and the whole navigation are emitted from the source tree by
        # .github/scripts/docs_hooks.py, so there is nothing to generate first and nothing to check
        # in. --strict: a warning is a failure, because a warning is what a dead link looks like
        # before it becomes one.
        run: python -m properdocs build --strict

      - name: Disable Jekyll processing
        run: touch site/.nojekyll

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          # Replace the site, but never a live pull request preview.
          clean: true
          clean-exclude: |
            pr-*
          commit-message: "docs: publish site from ${{ github.sha }}"
