name: PR Approval and Auto-Merge

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  pull-requests: write
  contents: write
  issues: write
  repository-projects: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@7585c73e7d00f8774627d05288bc3770003efe0d
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "7585c73e7d00f8774627d05288bc3770003efe0d"
    secrets:
      DARKFACTORY_APP_PRIVATE_KEY: ${{ secrets.DARKFACTORY_APP_PRIVATE_KEY }}
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
