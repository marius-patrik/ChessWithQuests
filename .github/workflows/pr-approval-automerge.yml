name: PR Approval and Auto-Merge

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  pull-requests: write
  contents: write
  issues: write
  repository-projects: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@69582bf743933597ee34a31dc2611b0f1972e1ab
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 69582bf743933597ee34a31dc2611b0f1972e1ab
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
