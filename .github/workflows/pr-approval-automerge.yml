name: PR Approval and Auto-Merge

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  pull-requests: write
  contents: write
  issues: write
  repository-projects: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/pr-approval-automerge.yml@8f2418f5ad6e12ec179ddd2fa20e3520edd8db42
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 8f2418f5ad6e12ec179ddd2fa20e3520edd8db42
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
