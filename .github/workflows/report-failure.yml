name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@56e369b18af1151b2cc651b953796435fc39d6c3
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "56e369b18af1151b2cc651b953796435fc39d6c3"
    secrets: inherit
