name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@480900aaac7f6e8f0284aa5e10385218e8890723
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "480900aaac7f6e8f0284aa5e10385218e8890723"
    secrets: inherit
