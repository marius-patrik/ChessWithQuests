name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@826f883ab1b7363a9bdbb39cf30af3437e5691ee
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "826f883ab1b7363a9bdbb39cf30af3437e5691ee"
    secrets: inherit
