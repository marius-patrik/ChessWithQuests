name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@1e6bdb0e060ea8dbf614bbec1d1fa7b9f3650228
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "1e6bdb0e060ea8dbf614bbec1d1fa7b9f3650228"
    secrets: inherit
