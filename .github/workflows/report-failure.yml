name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@757c89a91f48560e32bbb3315d5b1a1bde8f3cf9
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "757c89a91f48560e32bbb3315d5b1a1bde8f3cf9"
    secrets: inherit
