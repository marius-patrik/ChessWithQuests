name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@52816adc67cf9327831ecba775e8c9fdde764051
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "52816adc67cf9327831ecba775e8c9fdde764051"
    secrets: inherit
