name: Report Pipeline Failure

# Watches the other workflows and turns a failure into an issue, so a red run cannot scroll away.
on:
  workflow_run:
    workflows: [CI, Deploy Documentation, Release, Autonomous Agent]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    uses: marius-patrik/DarkFactory/.github/workflows/report-failure.yml@7585c73e7d00f8774627d05288bc3770003efe0d
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "7585c73e7d00f8774627d05288bc3770003efe0d"
    secrets: inherit
