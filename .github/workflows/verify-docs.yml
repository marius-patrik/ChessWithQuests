name: Verify Docs Layout

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  verify-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Verify dynamic documentation autogeneration
        run: |
          python -m mkdocs build --strict
          python -c '
          import os, sys
          repo_root = os.getcwd()
          src_dir = os.path.join(repo_root, "src")
          site_dir = os.path.join(repo_root, "site")
          assert os.path.isdir(src_dir), "src directory missing"
          assert os.path.isfile(os.path.join(site_dir, "index.html")), "site/index.html missing"
          assert os.path.isfile(os.path.join(site_dir, "controller/controller/index.html")), "controller docs missing"
          assert os.path.isfile(os.path.join(site_dir, "model/game/board/index.html")), "model docs missing"
          assert os.path.isfile(os.path.join(site_dir, "notes/index.html")), "notes index page missing"
          assert os.path.isfile(os.path.join(site_dir, "notes/chess_rules/index.html")), "chess_rules notes missing"
          assert os.path.isfile(os.path.join(site_dir, "notes/object_model/index.html")), "object_model notes missing"
          assert os.path.isfile(os.path.join(site_dir, "notes/reference_diagram/index.html")), "reference_diagram notes missing"
          assert os.path.isfile(os.path.join(site_dir, "notes/upstream_base/index.html")), "upstream_base notes missing"
          print("✅ Dynamic documentation build verified successfully!")
          '

      - name: Run documentation tests
        run: |
          pytest -v tests/test_mkdocs_and_docstrings.py
