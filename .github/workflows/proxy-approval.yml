name: Proxy PR Approval and Auto-Merge

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to approve and auto-merge'
        required: true
        type: string

jobs:
  proxy-approval-and-automerge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Process Proxy Approval and Auto-Merge
        run: |
          python3 -c '
          import os, sys, re, json, subprocess

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          actor = os.environ.get("GITHUB_ACTOR", "")
          repo_owner = os.environ.get("REPO_OWNER", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          print(f"Event: {event_name}, Actor: {actor}, Repo Owner: {repo_owner}")

          allowed_users = {repo_owner.lower(), "marius-patrik"}
          if actor.lower() not in allowed_users:
              print(f"Actor {actor} is not authorized for proxy approval ({allowed_users}). Exiting.")
              sys.exit(0)

          pr_number = None
          body = ""

          if event_name == "issue_comment":
              is_pr = os.environ.get("IS_PR") == "true"
              if not is_pr:
                  print("Comment is on an issue, not a pull request. Skipping.")
                  sys.exit(0)
              pr_number = os.environ.get("PR_NUMBER")
              body = os.environ.get("COMMENT_BODY", "").strip()

          elif event_name == "pull_request_review":
              pr_number = os.environ.get("PR_NUMBER")
              body = os.environ.get("REVIEW_BODY", "").strip()
              review_state = os.environ.get("REVIEW_STATE", "").upper()
              if review_state == "APPROVED":
                  body = "approved " + body

          elif event_name == "workflow_dispatch":
              pr_number = os.environ.get("INPUT_PR_NUMBER")
              body = "manual workflow dispatch approve"

          if not pr_number:
              print("No PR number found. Exiting.")
              sys.exit(0)

          trigger_pattern = r"(?i)\b(?:approve|approved|approves|/approve|merge|/merge|lgtm)\b"
          if not re.search(trigger_pattern, body):
              print(f"Body \"{body}\" does not match trigger pattern {trigger_pattern}. Skipping.")
              sys.exit(0)

          print(f"Trigger matched for PR #{pr_number}. Proceeding with proxy approval.")

          view_res = subprocess.run(
              ["gh", "pr", "view", str(pr_number), "--json", "isDraft,state,url,headRefName,baseRefName"],
              capture_output=True,
              text=True,
              check=True,
              env=dict(os.environ, GH_REPO=repo)
          )
          pr_data = json.loads(view_res.stdout)
          if pr_data.get("state") != "OPEN":
              print(f"PR #{pr_number} is {pr_data.get(\"state\")}, not OPEN. Exiting.")
              sys.exit(0)

          if pr_data.get("isDraft"):
              print(f"PR #{pr_number} is draft. Marking ready for review...")
              subprocess.run(
                  ["gh", "pr", "ready", str(pr_number)],
                  check=True,
                  env=dict(os.environ, GH_REPO=repo)
              )

          print(f"Submitting approving review on PR #{pr_number} as proxy for @{actor}...")
          review_cmd = [
              "gh", "pr", "review", str(pr_number),
              "--approve",
              "-b", f"Approved via proxy automation on behalf of @{actor} (signal: \"{body}\")."
          ]
          subprocess.run(review_cmd, check=True, env=dict(os.environ, GH_REPO=repo))

          print(f"Enabling auto-merge for PR #{pr_number}...")
          auto_merge_cmd = ["gh", "pr", "merge", str(pr_number), "--auto", "--merge"]
          res = subprocess.run(auto_merge_cmd, capture_output=True, text=True, env=dict(os.environ, GH_REPO=repo))
          print(f"Auto-merge command result (code {res.returncode}):\n{res.stdout}\n{res.stderr}")
          if res.returncode != 0:
              print("Attempting direct merge if checks are already green...")
              direct_merge_cmd = ["gh", "pr", "merge", str(pr_number), "--merge"]
              res_dir = subprocess.run(direct_merge_cmd, capture_output=True, text=True, env=dict(os.environ, GH_REPO=repo))
              print(f"Direct merge result:\n{res_dir.stdout}\n{res_dir.stderr}")
          '
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
