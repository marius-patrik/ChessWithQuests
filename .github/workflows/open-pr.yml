name: Open Pull Request

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Head branch name (e.g. feature/my-feature)'
        required: true
        type: string
      title:
        description: 'Pull Request title'
        required: true
        type: string
      body:
        description: 'Pull Request description'
        required: true
        type: string
      base:
        description: 'Target base branch'
        required: false
        default: 'main'
        type: string
      draft:
        description: 'Create as draft PR'
        required: false
        default: true
        type: boolean

# A caller, not a copy. Each dispatch input is forwarded by name because a called workflow receives
# nothing from this file's `inputs` context automatically.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/open-pr.yml@52816adc67cf9327831ecba775e8c9fdde764051
    with:
      branch: ${{ inputs.branch }}
      title: ${{ inputs.title }}
      body: ${{ inputs.body }}
      base: ${{ inputs.base }}
      draft: ${{ inputs.draft }}
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 52816adc67cf9327831ecba775e8c9fdde764051
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
