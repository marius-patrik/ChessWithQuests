name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@826f883ab1b7363a9bdbb39cf30af3437e5691ee
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "826f883ab1b7363a9bdbb39cf30af3437e5691ee"
    secrets: inherit
