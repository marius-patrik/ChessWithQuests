name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@56e369b18af1151b2cc651b953796435fc39d6c3
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "56e369b18af1151b2cc651b953796435fc39d6c3"
    secrets: inherit
