name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9"
    secrets: inherit
