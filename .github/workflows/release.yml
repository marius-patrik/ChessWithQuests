name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@234d84daa826cc3ef775b39009ee36c76ecf57a2
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "234d84daa826cc3ef775b39009ee36c76ecf57a2"
    secrets: inherit
