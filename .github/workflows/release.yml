name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@480900aaac7f6e8f0284aa5e10385218e8890723
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "480900aaac7f6e8f0284aa5e10385218e8890723"
    secrets: inherit
