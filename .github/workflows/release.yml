name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@757c89a91f48560e32bbb3315d5b1a1bde8f3cf9
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "757c89a91f48560e32bbb3315d5b1a1bde8f3cf9"
    secrets: inherit
