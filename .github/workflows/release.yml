name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@4f26dd372b6c921316b0ee69d2d0b50a2e584f18
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd372b6c921316b0ee69d2d0b50a2e584f18"
    secrets: inherit
