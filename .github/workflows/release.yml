name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@f0d838e891c73656952ca18bc49a8cae871dfed5
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "f0d838e891c73656952ca18bc49a8cae871dfed5"
    secrets: inherit
