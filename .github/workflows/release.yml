name: Release

# A caller, not a copy: the job body comes from the pinned pipeline commit.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: marius-patrik/DarkFactory/.github/workflows/release.yml@52816adc67cf9327831ecba775e8c9fdde764051
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "52816adc67cf9327831ecba775e8c9fdde764051"
    secrets: inherit
