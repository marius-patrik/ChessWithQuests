name: Auto Format

on:
  push:
    branches: ["**"]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@7ecba1617f553e6a34ceb31177e1ac84d08c350f
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "7ecba1617f553e6a34ceb31177e1ac84d08c350f"
    secrets: inherit
