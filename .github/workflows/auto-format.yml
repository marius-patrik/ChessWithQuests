name: Auto Format

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Every push on every branch, and the result is committed back to that branch, so formatting is
# never a choice anyone has to remember. The formatter is black at the line length [tool.black]
# declares in pyproject.toml - the same configuration `CI` checks with `black --check .`.
permissions:
  contents: write

jobs:
  format:
    name: format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          # Not required to format, but the cheapest way to be sure the commit below lands on the
          # branch the event fired for rather than on a detached head.
          fetch-depth: 0
          # GitHub deliberately runs no workflow for a push made with the automatic GITHUB_TOKEN, so
          # a formatting commit pushed with it becomes the head of a pull request that nothing ever
          # checks - and a protected branch then waits forever for contexts that will never report.
          # A token with `contents: write` stored as the `FORMAT_TOKEN` secret avoids that; without
          # it the commit is still made, it is simply not itself checked.
          token: ${{ secrets.FORMAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the formatter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Format the codebase
        run: black .

      - name: Commit and push formatting changes
        run: |
          # Tracked files only, and only the ones the formatter changed. `git add -A` also stages
          # whatever else the tree happens to hold, which would publish a change nobody made.
          git add -u
          if git diff --cached --quiet; then
            echo "No formatting changes needed. Codebase is clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A Conventional Commit inside this repository's own taxonomy, so the formatting commit
          # does not arrive as the one commit in the history that breaks the rule it enforces.
          # Deliberately no [skip ci]: a head that skips CI can never satisfy a required check.
          git commit -m "chore(area:ci): format the codebase with black"
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "Default branch; direct push skipped to comply with branch protection."
          else
            git push origin "${{ github.ref_name }}"
          fi
