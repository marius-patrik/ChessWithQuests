name: Auto Format

on:
  push:
    branches: ["**"]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@4f26dd372b6c921316b0ee69d2d0b50a2e584f18
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd372b6c921316b0ee69d2d0b50a2e584f18"
    secrets: inherit
