name: Auto Format

on:
  push:
    branches: ["**"]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@826f883ab1b7363a9bdbb39cf30af3437e5691ee
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 826f883ab1b7363a9bdbb39cf30af3437e5691ee
    secrets: inherit
