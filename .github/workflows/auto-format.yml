name: Auto Format

on:
  push:
    branches: ["**"]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@480900aaac7f6e8f0284aa5e10385218e8890723
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "480900aaac7f6e8f0284aa5e10385218e8890723"
    secrets: inherit
