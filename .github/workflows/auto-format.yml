name: Auto Format

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install "black>=24.0.0"

      - name: Run Black code formatter
        run: |
          black .

      - name: Commit and push formatted code if changes detected
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatting changes detected. Committing via Actions bot..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format codebase via GitHub Actions bot [skip ci]"
            if [ "${{ github.ref_name }}" != "main" ]; then
              git push origin ${{ github.ref_name }}
            else
              echo "Branch is main; direct push skipped to comply with branch protection."
            fi
          else
            echo "No formatting changes needed. Codebase is clean."
          fi
