name: Auto Format

on:
  push:
    branches: ["**"]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/auto-format.yml@757c89a91f48560e32bbb3315d5b1a1bde8f3cf9
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 757c89a91f48560e32bbb3315d5b1a1bde8f3cf9
    secrets: inherit
