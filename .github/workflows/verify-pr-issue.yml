name: Verify Bound Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  verify:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@8f2418f5ad6e12ec179ddd2fa20e3520edd8db42
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 8f2418f5ad6e12ec179ddd2fa20e3520edd8db42
