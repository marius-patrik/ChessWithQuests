name: Verify Bound Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  verify:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@6d42a0ea793a3e1fc26876ff99662a94f82bb987
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "6d42a0ea793a3e1fc26876ff99662a94f82bb987"
    secrets: inherit
