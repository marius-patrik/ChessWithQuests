name: Verify Bound Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  verify:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@234d84daa826cc3ef775b39009ee36c76ecf57a2
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 234d84daa826cc3ef775b39009ee36c76ecf57a2
    secrets: inherit
