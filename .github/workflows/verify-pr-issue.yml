name: Verify Bound Issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: write

jobs:
  verify:
    uses: marius-patrik/DarkFactory/.github/workflows/verify-pr-issue.yml@52816adc67cf9327831ecba775e8c9fdde764051
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: f0d838e891c73656952ca18bc49a8cae871dfed5
