name: CI

on:
  push:
    branches: ["main"]
  # No branch filter on purpose. The required checks are attached to pull requests, and this track's
  # pull requests are stacked on feature branches rather than on `main`, so a filter would leave
  # every stacked pull request without a run to satisfy and it could never merge.
  pull_request:
  workflow_dispatch:

# Self-contained by design: the required checks must not depend on another repository being
# reachable, pinned or maintained. This job is the whole pipeline for a Python project - install the
# declared development requirements, check the formatting, run the suite.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      # One failing version must not hide the other three.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting
        # Line length and target versions come from [tool.black] in pyproject.toml.
        run: black --check .

      - name: Run the test suite
        run: pytest -v
