name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# The pipeline itself lives in marius-patrik/DarkFactory and is pinned in
# `.github/darkfactory.json`. This file is a caller, not a copy: every job body, every script and
# every version matrix comes from the pinned commit, so adopting a pipeline update is a one-line
# change here and the diff shows exactly what moved.
#
# A caller has to exist on this branch because GitHub only runs workflow files that are present on
# the branch an event fires on - there is no way to drive the pipeline purely from a side branch.
# Secrets are not passed: CI needs none beyond the automatic GITHUB_TOKEN.
jobs:
  pipeline:
    uses: marius-patrik/DarkFactory/.github/workflows/ci.yml@39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 39807fd5554a5fd7c84f4ec3c0a163d0fd6e35a9
    secrets: inherit
