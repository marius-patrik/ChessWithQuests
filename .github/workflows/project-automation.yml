name: Project Board Automation

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [opened, edited, closed, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:

# The job bodies and the scripts they run come from the pinned pipeline. This file is a caller,
# not a copy. The job name is part of every check this reports, so renaming it renames the check.
permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  run:
    uses: marius-patrik/DarkFactory/.github/workflows/project-automation.yml@56e369b18af1151b2cc651b953796435fc39d6c3
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: 56e369b18af1151b2cc651b953796435fc39d6c3
    secrets:
      GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
