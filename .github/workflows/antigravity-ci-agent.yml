name: Antigravity CI Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  repository-projects: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Antigravity Agent Container
        run: |
          docker build -t antigravity-agent -f docker/Dockerfile.antigravity .

      - name: Dispatch Antigravity Agent in Container
        run: |
          docker run --rm \
            -e ANTIGRAVITY_REFRESH_TOKEN="${{ secrets.ANTIGRAVITY_REFRESH_TOKEN }}" \
            -e ANTIGRAVITY_CLIENT_ID="${{ secrets.ANTIGRAVITY_CLIENT_ID }}" \
            -e ANTIGRAVITY_CLIENT_SECRET="${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}" \
            -e GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            -e GITHUB_EVENT_PATH="/workspace/event.json" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -v "${{ github.event_path }}:/workspace/event.json:ro" \
            -v "${{ github.workspace }}:/workspace" \
            antigravity-agent dispatch

