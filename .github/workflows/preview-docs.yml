name: Preview Documentation

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview-docs:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@4f26dd372b6c921316b0ee69d2d0b50a2e584f18
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "4f26dd372b6c921316b0ee69d2d0b50a2e584f18"
    secrets: inherit
