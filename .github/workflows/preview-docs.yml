name: Preview Documentation

# A caller, not a copy: every job body comes from the pinned pipeline commit, so adopting
# an update is a one-line change here and the diff shows exactly what moved.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  deployments: write
  pull-requests: write

jobs:
  preview-docs:
    uses: marius-patrik/DarkFactory/.github/workflows/preview-docs.yml@234d84d9bc24ee246fc0b91d29759c8699b24479
    with:
      pipeline-repo: marius-patrik/DarkFactory
      pipeline-ref: "234d84d9bc24ee246fc0b91d29759c8699b24479"
    secrets: inherit
