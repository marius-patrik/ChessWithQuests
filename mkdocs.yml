site_name: ChessWithQuests
site_description: Chess game engine with quest mechanics and autogenerated API documentation
site_author: marius-patrik
repo_name: marius-patrik/ChessWithQuests
repo_url: https://github.com/marius-patrik/ChessWithQuests

docs_dir: src
exclude_docs: |
  *.py
  */*.py
  */*/*.py
  */*/*/*.py
  __pycache__
  __pycache__/*

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

hooks:
  - .github/scripts/mkdocs_hooks.py

nav:
  - Overview: index.md
  - Controllers:
      - controller/index.md
      - controller/controller.md
      - controller/window_controller.md
  - Model:
      - model/index.md
      - Pieces:
          - model/pieces/index.md
          - model/pieces/piece.md
          - model/pieces/bishop.md
          - model/pieces/horse.md
          - model/pieces/king.md
          - model/pieces/pawn.md
          - model/pieces/queen.md
          - model/pieces/rook.md
          - model/pieces/tower.md
      - Game:
          - model/game/index.md
          - model/game/board.md
          - model/game/logger.md
          - model/game/manager.md
          - model/game/move.md
          - model/game/player.md
          - model/game/quest.md
          - model/game/timer.md
          - model/game/validator.md
      - Users:
          - model/users/index.md
          - model/users/user.md
          - model/users/manager.md
      - Miscellaneous:
          - model/misc/index.md
          - model/misc/export_writers.md
          - model/misc/metadata.md
          - model/misc/notation.md
          - model/misc/quest_manager.md
  - View:
      - view/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".", "src"]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 3
