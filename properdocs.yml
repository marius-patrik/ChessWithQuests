site_name: ChessWithQuests
site_description: Chess game engine with quest mechanics and autogenerated API documentation
site_author: marius-patrik
repo_name: marius-patrik/ChessWithQuests
repo_url: https://github.com/marius-patrik/ChessWithQuests

docs_dir: src
exclude_docs: |
  *.py
  */*.py
  */*/*.py
  */*/*/*.py
  __pycache__
  __pycache__/*

theme:
  # The first-party theme shared by every repository on this pipeline, so the documentation of all
  # of them looks like one system and the version switcher works here too. Design system: shadcn/ui.
  name: null
  custom_dir: theme

hooks:
  - .github/scripts/docs_hooks.py

nav:
  - Overview: index.md
  - Controllers:
      - controller/index.md
      - controller/controller.md
      - controller/window_controller.md
  - Model:
      - model/index.md
      - Pieces:
          - model/pieces/index.md
          - model/pieces/piece.md
          - model/pieces/bishop.md
          - model/pieces/horse.md
          - model/pieces/king.md
          - model/pieces/pawn.md
          - model/pieces/queen.md
          - model/pieces/rook.md
          - model/pieces/tower.md
      - Game:
          - model/game/index.md
          - model/game/board.md
          - model/game/logger.md
          - model/game/manager.md
          - model/game/move.md
          - model/game/player.md
          - model/game/quest.md
          - model/game/timer.md
          - model/game/validator.md
      - Users:
          - model/users/index.md
          - model/users/user.md
          - model/users/manager.md
      - Miscellaneous:
          - model/misc/index.md
          - model/misc/export_writers.md
          - model/misc/metadata.md
          - model/misc/notation.md
          - model/misc/quest_manager.md
  - View:
      - view/index.md
  - Notes: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 2-4

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".", "src"]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 3
