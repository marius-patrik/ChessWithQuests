site_name: ChessWithQuests
site_description: Chess game engine with quest mechanics and autogenerated API documentation
site_author: marius-patrik
repo_name: marius-patrik/ChessWithQuests
repo_url: https://github.com/marius-patrik/ChessWithQuests

# The repository stores no documentation, and `docs_dir` cannot be the repository root:
# properdocs refuses a docs_dir that is the parent of its own config file. So docs_dir is a
# generated child directory that holds nothing but a placeholder. Every page - the
# overview, the notes and one page per Python module - is emitted as a virtual file by
# .github/scripts/docs_hooks.py, which builds the whole navigation from the same walk that
# emits the pages. Adding, renaming or deleting a module therefore needs no edit here, and
# a navigation entry can never point at a page that does not exist.
docs_dir: .docs

theme:
  # The first-party theme shared by every repository on this pipeline, so the documentation of all
  # of them looks like one system and the version switcher works here too. Design system: shadcn/ui.
  name: null
  custom_dir: theme

hooks:
  - .github/scripts/docs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
      toc_depth: 2-4

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 3
